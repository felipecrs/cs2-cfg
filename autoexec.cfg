echo "[-] loading autoexec.cfg..."

con_enable                          "1"   // Enable console

mm_dedicated_search_maxping         "30"

// video
fps_max                             "0"   // Max FPS in-game
fps_max_ui                          "0"   // Max FPS in the main menu

// disables fps drop when not focused
engine_no_focus_sleep               "0"

// sound
voice_modenable                     "1"
// speaker_config                   "1"   // Not sure what this does
snd_musicvolume                     "0.1"
snd_tensecondwarning_volume         "1"
snd_mute_mvp_music_live_players     "1"
snd_menumusic_volume                "0"
snd_roundstart_volume               "0"
snd_roundaction_volume              "0"
snd_roundend_volume                 "0"
snd_deathcamera_volume              "0"
snd_mapobjective_volume             "0"
snd_mute_losefocus                  "0"   // Do not mute the game when minimized (alt-tab)

// hud
cq_netgraph                         "0"   // Set to 1 to enable. Shows connection and FPS info
cl_hud_telemetry_serverrecvmargin_graph_show "1"
cl_radar_scale                      "0.5" // Radar scale. Closer to 0 is smaller, closer to 1 is larger
cl_hud_radar_scale                  "1"
cl_radar_icon_scale_min             "0.6" // Size of players on radar. 0.4 smallest, default 0.6, 1 largest
cl_radar_always_centered            "1"   // Radar is not always centered. Gives a better view of the full map
cl_radar_rotate                     "1"
cl_showloadout                      "1"   // Always show inventory (e.g., grenade count). 0 fades out after a while
cl_autohelp                         "1"   // Enable autohelp (e.g., see if glock/famas is on burst/auto)
cl_teammate_colors_show             "1"   // Show teammate colors on the radar
cl_color                            "1"   // Preferred color -> 0 = yellow, 1 = purple, 2 = green, 3 = blue, 4 = orange
cl_use_opens_buy_menu               "0"   // Disable opening buy menu with the 'use' key (E)
gameinstructor_enable               "0"   // Disable game instructor arrows (e.g., pointing to dropped bomb)
hud_showtargetid                    "1"   // Show enemy name when aiming at them
cl_show_clan_in_death_notice        "0"   // Disable clan tags in the death notice feed

bind "f1"                           "vote option1; say aprenda sobre o CS:GO em www.youtube.com/user/PinkFreudBrasil"
bind "t"                            "+voicerecord"
bind "k"                            "+spray_menu"
bind "1"                            "slot1"
bind "2"                            "slot2"
bind "3"                            "slot3"

bind "KP_0"                         "buy vesthelm; buy vest"
bind "KP_1"                         "buy hegrenade"
bind "KP_2"                         "buy flashbang"
bind "KP_3"                         "buy smokegrenade"
bind "KP_4"                         "buy ak47; buy m4a1; buy m4a1_silencer"
bind "KP_5"                         "buy awp"
bind "KP_6"                         "buy p250"
bind "KP_7"                         "buy p90"
bind "KP_8"                         "buy famas; buy galilar"
bind "KP_9"                         "buy ump45"
bind "KP_MULTIPLY"                  "displaydamage"
bind "KP_MINUS"                     "buy decoy"
bind "KP_PLUS"                      "buy molotov; buy incgrenade"
bind "KP_DEL"                       "buy defuser"

// crosshair
cl_crosshairalpha                   "200"
cl_crosshaircolor                   "5"
cl_crosshaircolor_b                 "255"
cl_crosshaircolor_r                 "255"
cl_crosshaircolor_g                 "0"
cl_crosshairdot                     "0"
cl_crosshairgap                     "-3"
alias "default_crosshairsize"       "cl_crosshairsize 4"
default_crosshairsize
cl_crosshairstyle                   "4"
cl_crosshairusealpha                "1"
cl_crosshairthickness               "1"
cl_fixedcrosshairgap                "-3"
cl_crosshair_outlinethickness       "0"
cl_crosshair_drawoutline            "0"

alias "+use_and_see_bomb_by_pink_"  "+use; gameinstructor_enable 1"
alias "-use_and_see_bomb_by_pink_"  "-use; gameinstructor_enable 0"
bind "e"                            "+use_and_see_bomb_by_pink_"

alias "+smoke_throw"                "cl_crosshairsize 9999"
alias "-smoke_throw"                "default_crosshairsize"
bind "mouse5"                       "+smoke_throw"

// mouse
sensitivity                         "0.7" // For 1600dpi mouse and 2560x1440 resolution
zoom_sensitivity_ratio              "1"
cl_sniper_auto_rezoom               "1"
cl_sniper_delay_unscope             "0"

// volume settings
alias "default_volume"              "volume 0.4; snd_voipvolume 0.5"
default_volume
bind "j"                            "volume 0.5; snd_voipvolume 0.1" // Decrease the chat volume
bind "v"                            "default_volume"                 // Restore volume
bind "n"                            "volume 0"                       // Mute the entire game

host_writeconfig

echo "[+] autoexec.cfg loaded"
